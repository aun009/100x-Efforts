<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator Server</title>

    <script>
        async function add() {
            const a = document.getElementById("first").value;
            const b = document.getElementById("second").value;

            const res = await fetch("http://localhost:3002/sum/", {
                method : "POST",
                headers : {
                    "Content-Type" : "application/json"
                },
                body: JSON.stringify({
                    a: a,
                    b : b
                })
            });
            const json = await res.json()

            console.log(json.ans);
            

            document.getElementById("result").innerHTML = json.ans;
        }
    </script>
</head>
<body>
    <input id="first" type="text" placeholder="First number">
    <input id="second" type="text" placeholder="Second number">

    <br>
    <button onclick="add()">Sum</button>
    <button>Sub</button>
    <button>Mult</button>
    <button>Div</button>


    <div id="result"></div>
</body>
</html>
